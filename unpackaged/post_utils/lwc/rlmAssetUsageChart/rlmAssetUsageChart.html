<template>
    <lightning-card title="Usage Chart" icon-name="standard:metrics">
        <div class="slds-p-horizontal_medium slds-p-bottom_medium">
            <!-- Loading -->
            <template if:true={isLoading}>
                <div class="slds-is-relative slds-p-vertical_large">
                    <lightning-spinner alternative-text="Loading usage chart" size="small"></lightning-spinner>
                </div>
            </template>

            <!-- Empty state -->
            <template if:true={noData}>
                <p class="slds-text-color_weak slds-p-vertical_small">
                    No usage found for this asset.
                </p>
            </template>

            <!-- Data -->
            <template if:true={hasData}>
                <!-- Legend -->
                <div class="slds-m-bottom_small">
                    <span class="legend-item">
                        <span class="legend-swatch legend-swatch_available"></span>
                        <span class="slds-text-body_small">Total Available</span>
                    </span>
                    <span class="legend-item slds-m-left_medium">
                        <span class="legend-swatch legend-swatch_consumed"></span>
                        <span class="slds-text-body_small">Effective Consumed</span>
                    </span>
                </div>

                <template for:each={resources} for:item="resource">
                    <div key={resource.id} class="slds-m-bottom_large">
                        <!-- Resource + entitled product header -->
                        <div class="slds-m-bottom_x-small">
                            <span class="slds-text-title_bold">{resource.name}</span>
                            <span class="slds-text-color_weak slds-m-left_xx-small">{resource.uomLabel}</span>
                        </div>
                        <template if:true={resource.hasProduct}>
                            <div class="slds-text-body_small slds-text-color_weak slds-m-bottom_x-small">
                                Entitled product: <span class="slds-text-color_default">{resource.productName}</span>
                            </div>
                        </template>

                        <!-- Grouped bar chart -->
                        <div class="chart-scroll">
                            <svg
                                class="chart"
                                width={resource.svgWidth}
                                height={resource.svgHeight}
                                viewBox={resource.viewBox}
                                role="img"
                                aria-label={resource.ariaLabel}
                            >
                                <!-- Gridlines + y-axis value labels -->
                                <template for:each={resource.gridlines} for:item="line">
                                    <g key={line.key}>
                                        <line
                                            class="gridline"
                                            x1={line.x1}
                                            y1={line.y}
                                            x2={line.x2}
                                            y2={line.y}
                                        ></line>
                                        <text class="axis-label" x={line.labelX} y={line.labelY} text-anchor="end">
                                            {line.label}
                                        </text>
                                    </g>
                                </template>

                                <!-- Bars -->
                                <template for:each={resource.bars} for:item="bar">
                                    <rect
                                        key={bar.key}
                                        class={bar.className}
                                        x={bar.x}
                                        y={bar.y}
                                        width={bar.width}
                                        height={bar.height}
                                        rx="2"
                                    >
                                        <title>{bar.title}</title>
                                    </rect>
                                </template>

                                <!-- Month labels -->
                                <template for:each={resource.monthLabels} for:item="label">
                                    <text
                                        key={label.key}
                                        class="axis-label"
                                        x={label.x}
                                        y={label.y}
                                        text-anchor="middle"
                                    >
                                        {label.text}
                                    </text>
                                </template>
                            </svg>
                        </div>
                    </div>
                </template>
            </template>
        </div>
    </lightning-card>
</template>
